<html>
    <head>
        <title>ネコ検出キット</title>
        <meta charset="UTF-8">
        <link href="css/pc.css" rel ="stylesheet" type="text/css">
        <link href="css/sp.css" media="screen and (max-width:768px)"
              rel ="stylesheet" type="text/css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
            <div id="loading_screen" style="display: block; text-align: center; padding: 2em; font-size: 1.5em; background: #fff; position: fixed; top:0; left:0; width:100vw; height:100vh; z-index:999;">
                Loading: Cat Detection System ネコ検出キット 🐈
            </div>
        <script type="text/javascript">

            // Add event listener
            const catCascadeFile = './cascade.xml';

            function openCvready() {
                cv['onRuntimeInitialized']=()=>{
                    // Hide loading, show main
                    let utils = new Utils('errorMessage');
                    utils.createFileFromUrl(catCascadeFile, catCascadeFile, () => {
                        document.getElementById('loading_screen').style.display = 'none';
                        document.getElementById('main_content').style.display = 'block';
                        let fileButton = document.getElementById("file_button");
                        fileButton.addEventListener('change', canvasDraw);
                        let submitButton = document.getElementById("submit_button");
                        submitButton.addEventListener('click', sendImage);
                    });
                }
            };
        


            // upload and receive id
            function sendImage(){
                detectCat(document.getElementById("preview"), catCascadeFile);
                return false;
            }
            
            function canvasDraw() {
                var file = document.getElementById("file_button").files[0];

                //画像ファイルかチェック
                if (file["type"] != "image/jpeg" && file["type"] != "image/png" && file["type"] != "image/gif") {
                    alert("画像ファイルを選択してください");
                    document.getElementById("file_button").val(''); //選択したファイルをクリア

                } else {
                    var fr = new FileReader();

                    fr.onload = function() {
                        //選択した画像を一旦imgタグに表示
                        document.getElementById("preview").src = fr.result;

                        // リサイズ基準を.card-bodyの幅に変更
                        var cardBody = document.querySelector('.card-body');

                        //imgタグに表示した画像をimageオブジェクトとして取得
                        var image = new Image();
                        image.onload = function() { 
                            //resize
                            var w = cardBody ? (cardBody.clientWidth - 100) : 400;
                            var ratio = w / image.width;
                            var h = image.height * ratio;

                            //canvas
                            var canvas = document.getElementById("canvas");
                            var ctx = canvas.getContext('2d');
                            document.getElementById("canvas").width = w;
                            document.getElementById("canvas").height = h;
                            ctx.drawImage(image, 0, 0, w, h);
                        }
                        image.src = document.getElementById("preview").src;
                    };

                    fr.readAsDataURL(file);
                }
            }

            function detectCat(imgDataElm , catCascadeFile) {

                let detector = new cv.CascadeClassifier();
                detector.load(catCascadeFile);
                let cats = new cv.RectVector();
                let imgData = cv.imread('canvas');
                detector.detectMultiScale(imgData, cats, 1.1, 3, 0);

                for (let i =0; i < cats.size(); i++) {
                    let point1 = new cv.Point(cats.get(i).x, cats.get(i).y);
                    let point2 = new cv.Point(cats.get(i).x + cats.get(i).width, cats.get(i).y + cats.get(i).height);
                    cv.rectangle(imgData, point1, point2, [255, 0, 0, 255]);
                }

                setMessageToStatusArea(cats.size() + " 匹のネコが検出されました。 / " + cats.size() + " cat(s) detected.");
                cv.imshow('canvas', imgData);
                imgData.delete(); 
                detector.delete();
                cats.delete();
            }

            function setMessageToStatusArea (strMessage) {
                document.getElementById('status_area').style.display = 'block';
                var msgDiv = document.getElementById('status_message');
                if (msgDiv) {
                    msgDiv.innerHTML = "<p>" + strMessage + "</p>";
                }
            }

        </script>


        <div id="main_content" style="display: none;">
            <header class="app-header">
                <h1>Cat Detection System <span class="sub">ネコ検出キット</span></h1>
            </header>
            <main>
                <section class="card">
                    <div class="card-body">
                        <h2>Detect cats in your images</h2>
                        <p class="desc">Upload an image and click the button to detect cats using OpenCV.js.</p>
                        <form id="imgForm" class="form">
                            <label for="file_button" class="form-label">1. Select image</label>
                            <input type="file" id="file_button" class="form-input">
                            <label for="file_button" class="form-label">2. Click the button to detect cats</label>
                            <button type="button" id="submit_button" class="button">Detect Cat</button>
                        </form>
                        <div id="status_area" class="status-area" style="display: none;">
                            <div id="status_message"></div>
                            <button id="reset_btn" type="button" style="margin-bottom:8px;">Reset</button>
                        </div>
                        <div class="canvas-container">
                            <canvas id="canvas"></canvas>
                        </div>
                        <div class="footer">
                            <span>CLB</span>
                        </div>
                        <div id="errorMessage" class="error-message"></div>
                        <img src="" id="preview" style="visibility:hidden;display: none;"/>
                    </div>
                </section>
            </main>
        </div>

        <script src="lib/opencv.js" type="text/javascript" onload="openCvready();"></script>
        <script src="lib/utils.js" type="text/javascript"></script>
        <script>
        // リセットボタンの処理
        window.addEventListener('DOMContentLoaded', function() {
            var resetBtn = document.getElementById('reset_btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    // canvasをクリア
                    var canvas = document.getElementById('canvas');
                    if (canvas) {
                        var ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                    // ステータスメッセージを更新
                    setMessageToStatusArea('状態をリセットしました');
                });
            }
        });
        </script>
    </body>
</html>
